[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erabi"
version = "0.1.0"
description = "ERABI - Local probability distribution engine for choices"
authors = [
    { name = "ERABI Project" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.40.0",
    "gliclass>=0.1.20",
    "pydantic>=2.0.0",
]

[project.scripts]
erabi = "erabi.__main__:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
calibrate = [
    "scipy>=1.12.0",
]
data-gen = [
    "openai>=2.54.0,<3",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/sugarkwork/erabi"

[tool.setuptools.packages.find]
where = ["src"]
